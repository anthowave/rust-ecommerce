[workspace]
resolver = "2"
# KEY LESSON: Workspace members are listed here as we build them.
# Only existing crates are included — adding non-existent paths causes build errors.
# We'll add user-service, cart-service, etc. as we progress through each phase.
members = [
    "crates/common",
    "crates/product-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Web framework ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# --- Database ---
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Logging & Tracing ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Error handling ---
thiserror = "2"
anyhow = "1"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
config = "0.15"

# --- HTTP client ---
reqwest = { version = "0.12", features = ["json"] }

# --- Validation ---
validator = { version = "0.20", features = ["derive"] }

# --- Password hashing ---
argon2 = "0.5"

# --- JWT ---
jsonwebtoken = "9"

# --- Redis ---
redis = { version = "0.28", features = ["tokio-comp"] }

# --- Decimal (for money) ---
rust_decimal = { version = "1", features = ["serde"] }

# --- Retry ---
backon = "1"

# --- Async trait ---
async-trait = "0.1"

# --- Futures utilities ---
futures = "0.3"

# --- RabbitMQ ---
# lapin = "2"  # Uncomment in Phase 6